<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="100%" role="img" aria-labelledby="watcher-flow-title" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">
  <title id="watcher-flow-title">Saved files reach the watcher daemon, which queues one run per task and starts each as its own asgard process; every task's output lands in watcher.log, and asgard watcher stop ends the daemon.</title>
  <defs>
    <marker id="arrow-watch" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" fill-opacity="0.6"/>
    </marker>
  </defs>

  <!-- edited files -->
  <rect x="20" y="80" width="170" height="90" rx="8" fill="#a78bfa" fill-opacity="0.22" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="105" y="104" text-anchor="middle" fill="currentColor" font-weight="600">files you save</text>
  <text x="105" y="128" text-anchor="middle" fill="currentColor" font-family="ui-monospace, monospace" font-size="12">lib/greeter.rb</text>
  <text x="105" y="148" text-anchor="middle" fill="currentColor" font-family="ui-monospace, monospace" font-size="12">docs/index.md</text>

  <!-- daemon -->
  <rect x="250" y="40" width="220" height="170" rx="8" fill="#fbbf24" fill-opacity="0.22" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="360" y="64" text-anchor="middle" fill="currentColor" font-weight="600">watcher daemon</text>
  <text x="360" y="82" text-anchor="middle" fill="currentColor" font-size="12">one per project, matches each change</text>
  <text x="360" y="97" text-anchor="middle" fill="currentColor" font-size="12">against the watch declarations</text>
  <rect x="268" y="112" width="184" height="36" rx="6" fill="#fbbf24" fill-opacity="0.18" stroke="#fbbf24" stroke-width="1"/>
  <text x="360" y="135" text-anchor="middle" fill="currentColor" font-size="12">queue for lint: one run at a time</text>
  <rect x="268" y="158" width="184" height="36" rx="6" fill="#fbbf24" fill-opacity="0.18" stroke="#fbbf24" stroke-width="1"/>
  <text x="360" y="181" text-anchor="middle" fill="currentColor" font-size="12">queue for docs: one run at a time</text>

  <!-- task processes -->
  <rect x="530" y="40" width="210" height="60" rx="8" fill="#2dd4bf" fill-opacity="0.22" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="635" y="64" text-anchor="middle" fill="currentColor" font-family="ui-monospace, monospace" font-size="13">asgard lint</text>
  <text x="635" y="86" text-anchor="middle" fill="currentColor" font-size="12">changes.modified = ["lib/greeter.rb"]</text>

  <rect x="530" y="150" width="210" height="60" rx="8" fill="#2dd4bf" fill-opacity="0.22" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="635" y="174" text-anchor="middle" fill="currentColor" font-family="ui-monospace, monospace" font-size="13">asgard docs</text>
  <text x="635" y="196" text-anchor="middle" fill="currentColor" font-size="12">changes.modified = ["docs/index.md"]</text>

  <!-- log -->
  <rect x="530" y="250" width="210" height="50" rx="8" fill="#a3e635" fill-opacity="0.22" stroke="#a3e635" stroke-width="1.5"/>
  <text x="635" y="272" text-anchor="middle" fill="currentColor" font-weight="600">watcher.log</text>
  <text x="635" y="290" text-anchor="middle" fill="currentColor" font-size="12">trigger, spawn, task output, exit</text>

  <!-- stop -->
  <rect x="20" y="250" width="170" height="50" rx="8" fill="#fb7185" fill-opacity="0.22" stroke="#fb7185" stroke-width="1.5"/>
  <text x="105" y="272" text-anchor="middle" fill="currentColor" font-family="ui-monospace, monospace" font-size="13">asgard watcher stop</text>
  <text x="105" y="290" text-anchor="middle" fill="currentColor" font-size="12">running tasks finish first</text>

  <!-- connectors -->
  <line x1="190" y1="125" x2="248" y2="125" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" marker-end="url(#arrow-watch)"/>
  <line x1="452" y1="130" x2="528" y2="70" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" marker-end="url(#arrow-watch)"/>
  <line x1="452" y1="176" x2="528" y2="180" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" marker-end="url(#arrow-watch)"/>
  <line x1="700" y1="100" x2="700" y2="148" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="700" y1="210" x2="700" y2="248" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" marker-end="url(#arrow-watch)"/>
  <text x="712" y="130" fill="currentColor" fill-opacity="0.7" font-size="11">output</text>
  <path d="M 190 275 L 230 275 L 230 215 L 300 215 L 300 212" fill="none" stroke="#fb7185" stroke-opacity="0.8" stroke-width="1.5" marker-end="url(#arrow-watch)"/>
  <text x="360" y="234" text-anchor="middle" fill="currentColor" fill-opacity="0.7" font-size="11">different tasks run at the same time; a task never overlaps itself</text>
</svg>
