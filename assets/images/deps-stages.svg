<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="100%" role="img" aria-labelledby="deps-stages-title">
  <title id="deps-stages-title">Execution stages of depends_on :setup, [:lint, :build], :test, :notify followed by the ci task</title>
  <defs>
    <marker id="deps-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" fill-opacity="0.6"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="currentColor">
    <!-- stage labels -->
    <g font-size="12" fill-opacity="0.65">
      <text x="60" y="26" text-anchor="middle">stage 1</text>
      <text x="230" y="26" text-anchor="middle">stage 2 (parallel)</text>
      <text x="400" y="26" text-anchor="middle">stage 3</text>
      <text x="540" y="26" text-anchor="middle">stage 4</text>
      <text x="690" y="26" text-anchor="middle">the task</text>
    </g>

    <!-- stage 2 group outline -->
    <rect x="160" y="60" width="140" height="230" rx="12" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="1" stroke-dasharray="4 3"/>

    <!-- setup -->
    <rect x="10" y="150" width="100" height="44" rx="8" fill="#2dd4bf" fill-opacity="0.22" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="60" y="178" text-anchor="middle">setup</text>

    <!-- lint -->
    <rect x="180" y="90" width="100" height="44" rx="8" fill="#2dd4bf" fill-opacity="0.22" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="230" y="118" text-anchor="middle">lint</text>

    <!-- build -->
    <rect x="180" y="210" width="100" height="44" rx="8" fill="#2dd4bf" fill-opacity="0.22" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="230" y="238" text-anchor="middle">build</text>

    <!-- test -->
    <rect x="350" y="150" width="100" height="44" rx="8" fill="#2dd4bf" fill-opacity="0.22" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="400" y="178" text-anchor="middle">test</text>

    <!-- notify -->
    <rect x="490" y="150" width="100" height="44" rx="8" fill="#2dd4bf" fill-opacity="0.22" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="540" y="178" text-anchor="middle">notify</text>

    <!-- ci -->
    <rect x="640" y="150" width="100" height="44" rx="8" fill="#fbbf24" fill-opacity="0.22" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="690" y="178" text-anchor="middle">ci</text>

    <!-- connectors -->
    <g fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5" marker-end="url(#deps-arrow)">
      <path d="M 110 172 C 145 172, 145 112, 178 112"/>
      <path d="M 110 172 C 145 172, 145 232, 178 232"/>
      <path d="M 280 112 C 315 112, 315 172, 348 172"/>
      <path d="M 280 232 C 315 232, 315 172, 348 172"/>
      <path d="M 450 172 L 488 172"/>
      <path d="M 590 172 L 638 172"/>
    </g>

    <!-- caption line -->
    <g font-size="12" fill-opacity="0.65">
      <text x="230" y="312" text-anchor="middle">both finish before stage 3 starts</text>
    </g>
  </g>
</svg>
