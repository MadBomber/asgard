---
# Reek is advisory here (see quality.loki: reek_check reports :warn, never
# :fail). Asgard is a DSL built from pure, separately tested functions and
# Thor classes whose state is assembled at class level, so most of Reek's
# object-centric heuristics describe that design rather than a defect.
# Only the detectors that have pointed at something real in this codebase
# stay enabled: dead code, leaking writable state, a missing value object and
# unclear names. Everything else is disabled, not excluded per method.
detectors:

  # ── Enabled ────────────────────────────────────────────────────────────
  Attribute:
    enabled: true
  DataClump:
    enabled: true
  RepeatedConditional:
    enabled: true
  TooManyInstanceVariables:
    enabled: true
    max_instance_variables: 6   # default 4; Doctor tracks several pieces of diagnostic state
  UncommunicativeMethodName:
    enabled: true
  UncommunicativeModuleName:
    enabled: true
  UncommunicativeParameterName:
    enabled: true
  UncommunicativeVariableName:
    enabled: true
    accept:                     # standard short names for limited-scope variables
      - _    # intentionally ignored
      - d    # dep / dir / data
      - e    # rescue => e
      - f    # file / finding
      - h    # hash
      - i    # index
      - k    # key
      - p    # path
      - t    # task / thread
  UnusedParameters:
    enabled: true
  UnusedPrivateMethod:
    enabled: true               # off by default in Reek; dead private code is a real finding

  # ── Disabled ───────────────────────────────────────────────────────────
  BooleanParameter:
    enabled: false
  ClassVariable:
    enabled: false
  ControlParameter:
    enabled: false
  DuplicateMethodCall:
    enabled: false
  FeatureEnvy:
    enabled: false
  InstanceVariableAssumption:
    enabled: false
  IrresponsibleModule:
    enabled: false
  LongParameterList:
    enabled: false
  LongYieldList:
    enabled: false
  ManualDispatch:
    enabled: false
  MissingSafeMethod:
    enabled: false
  ModuleInitialize:
    enabled: false
  NestedIterators:
    enabled: false
  NilCheck:
    enabled: false
  SubclassedFromCoreClass:
    enabled: false
  TooManyConstants:
    enabled: false
  TooManyMethods:
    enabled: false
  TooManyStatements:
    enabled: false
  UtilityFunction:
    enabled: false

exclude_paths:
  - test
  - docs
  - coverage
  - pkg
